[project]
name = "kiko-hh-parser"
version = "0.1.0"
description = "HH vacancy collection and backend delivery for Kiko"
requires-python = ">=3.12"
dependencies = [
    "kiko-parsers-base>=0.1.0",
    "scrapling[fetchers]",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
