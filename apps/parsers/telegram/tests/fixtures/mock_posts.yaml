- id: "senior_python"
  expected_is_vacancy: true
  channel_username: "python_jobs"
  message_id: 101
  text: |
    Senior Python Developer в FinTech экосистему PayCore

    Компания: PayCore
    Формат: Офисы в Сербии(Москва, Новосибирск)
    Занятость: Полная
    Грейд: Senior
    Зарплатная вилка: от 350 000 до 450 000 руб. на руки

    О проекте:
    Мы разрабатываем отказоустойчивую платежную платформу с микросервисной архитектурой, обрабатывающую миллионы транзакций в сутки.

    Что предстоит делать:
    - Проектировать и развивать high-load backend сервисы на Python / FastAPI
    - Оптимизировать запросы PostgreSQL и кэширование в Redis
    - Настраивать межсервисное взаимодействие через Apache Kafka
    - Участвовать в архитектурных ревью и менторить младших коллег

    Требования:
    - Опыт коммерческой разработки на Python от 4 лет
    - Отличное знание FastAPI, asyncio, PostgreSQL, SQLAlchemy / Tortoise ORM
    - Опыт работы с брокерами сообщений (Kafka / RabbitMQ)
    - Опыт работы с Docker, Kubernetes, CI/CD

    Условия:
    - Официальное оформление или по договору ИП/самозанятости
    - Полный ДМС со стоматологией
    - Бюджет на обучение и технику
    - Гибкое начало рабочего дня

    Контакты: @paycore_talent

