[project]
name = "habr-parser"
version = "0.1.0"
description = "Habr Career vacancy parser built on parsers_base"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27", 
    "beautifulsoup4>=4.12",
    "kiko-parsers-base"
]

[tool.uv.sources]
kiko-parsers-base = {path = "../base", editable = true}


[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["habr_parser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
