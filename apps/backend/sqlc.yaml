version: "2"

sql:
  - engine: "postgresql"
    schema: "../../database/migrations"
    queries: "./internal/adapter/out/postgres/queries"
    gen:
      go:
        package: "sqlc"
        out: "./internal/adapter/out/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_methods_with_db_argument: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
