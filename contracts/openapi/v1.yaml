openapi: 3.0.3
info:
  title: Kiko API Contracts
  description: >-
    Central REST API specification for Kiko Core Backend (Go).
    Consumed by Web Client, Telegram Bot Client, Parsers, and AI Worker.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: System
    description: Health check and status endpoints
  - name: Users
    description: User profile management and authentication
  - name: User Settings
    description: Search preferences (skills, grade, employment type, location)
  - name: CV
    description: User CV and resume management
  - name: Vacancies
    description: Vacancy catalog and parser ingestion
  - name: Recommendations
    description: Personalized user vacancies, matching results, and interactions
  - name: Internal AI
    description: Internal endpoints for AI-Worker (matching and scoring)

paths:
  # ==========================================
  # SYSTEM
  # ==========================================
  /health:
    get:
      tags:
        - System
      summary: Health check
      description: Returns health status of the backend and database connection.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  # ==========================================
  # USERS
  # ==========================================
  /users:
    post:
      tags:
        - Users
      summary: Register or sync user
      description: Create a new user or retrieve existing by Telegram ID (upsert).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateUserRequest'
      responses:
        '200':
          description: User retrieved or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Users
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/by-telegram/{telegram_id}:
    get:
      tags:
        - Users
      summary: Get user by Telegram ID
      description: Fast lookup for Telegram Bot client.
      parameters:
        - name: telegram_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # USER SETTINGS
  # ==========================================
  /users/{id}/settings:
    get:
      tags:
        - User Settings
      summary: Get user search settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User settings found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - User Settings
      summary: Create or update user search settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUserSettingsRequest'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'

  # ==========================================
  # CV (RESUME)
  # ==========================================
  /users/{id}/cv:
    get:
      tags:
        - CV
      summary: Get user's CV metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: CV found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CV'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - CV
      summary: Attach or update user's CV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCVRequest'
      responses:
        '200':
          description: CV saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CV'

    delete:
      tags:
        - CV
      summary: Delete user's CV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: CV deleted

  # ==========================================
  # VACANCIES
  # ==========================================
  /vacancies:
    get:
      tags:
        - Vacancies
      summary: List catalog vacancies
      parameters:
        - name: source
          in: query
          description: Filter by source platform (e.g. HH.ru, Telegram)
          schema:
            type: string
        - name: company
          in: query
          description: Search by company name
          schema:
            type: string
        - name: location
          in: query
          description: Filter by location
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of vacancies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vacancy'

    post:
      tags:
        - Vacancies
      summary: Ingest single vacancy (Parser)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVacancyRequest'
      responses:
        '201':
          description: Vacancy ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'

  /vacancies/batch:
    post:
      tags:
        - Vacancies
      summary: Batch ingest vacancies (Parser)
      description: Recommended endpoint for parsers to batch-upload parsed vacancies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateVacanciesRequest'
      responses:
        '200':
          description: Batch ingestion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted:
                    type: integer
                    example: 25
                  ignored:
                    type: integer
                    description: Count of duplicates skipped
                    example: 3

  /vacancies/{id}:
    get:
      tags:
        - Vacancies
      summary: Get vacancy details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Vacancy found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vacancy'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # RECOMMENDATIONS & USER VACANCIES
  # ==========================================
  /users/{id}/recommendations:
    get:
      tags:
        - Recommendations
      summary: Get personalized recommendations for user
      description: Returns scored vacancies with match score and AI summary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: min_score
          in: query
          description: Minimum match score filter (0-100)
          schema:
            type: integer
            default: 40
        - name: is_seen
          in: query
          description: Filter by seen status
          schema:
            type: boolean
        - name: is_favorite
          in: query
          description: Filter by favorite status
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserVacancyWithDetails'

  /users/{id}/vacancies/{vacancy_id}:
    get:
      tags:
        - Recommendations
      summary: Get user recommendation status for a specific vacancy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: vacancy_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVacancyWithDetails'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Recommendations
      summary: Update seen or favorite state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: vacancy_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserVacancyRequest'
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserVacancy'

  /users/{id}/vacancies/{vacancy_id}/cover-letter:
    post:
      tags:
        - Recommendations
      summary: Generate or retrieve AI Cover Letter
      description: Generates a tailored cover letter based on user profile, CV, and vacancy.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: vacancy_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCoverLetterRequest'
      responses:
        '200':
          description: Cover letter generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverLetterResponse'

  # ==========================================
  # INTERNAL / AI WORKER
  # ==========================================
  /internal/matching/pending-tasks:
    get:
      tags:
        - Internal AI
      summary: Get unscored pairs for matching
      description: Returns users and newly ingested vacancies ready for AI analysis.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: List of pending matching tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchingTask'

  /internal/matching/results:
    post:
      tags:
        - Internal AI
      summary: Save batch of match results
      description: AI Worker sends calculated match scores and summaries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSaveMatchResultsRequest'
      responses:
        '200':
          description: Results saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved_count:
                    type: integer
                    example: 50

components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Not found"

  schemas:
    # ----------------------------------------
    # Enums
    # ----------------------------------------
    InterfaceLang:
      type: string
      enum: [EN, RU, CN]
      example: EN

    Grade:
      type: string
      enum: [INTERN, JUNIOR, MIDDLE, SENIOR, LEAD]
      example: MIDDLE

    EmploymentType:
      type: string
      enum: [REMOTE, OFFICE, HYBRID, CONTRACT]
      example: REMOTE

    # ----------------------------------------
    # User Schemas
    # ----------------------------------------
    User:
      type: object
      required:
        - id
        - telegram_id
        - first_name
        - language
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        telegram_id:
          type: integer
          format: int64
          example: 123456789
        username:
          type: string
          nullable: true
          example: "johndoe"
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          nullable: true
          example: "Doe"
        language:
          $ref: '#/components/schemas/InterfaceLang'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrUpdateUserRequest:
      type: object
      required:
        - telegram_id
        - first_name
      properties:
        telegram_id:
          type: integer
          format: int64
          example: 123456789
        username:
          type: string
          example: "johndoe"
        first_name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        language:
          $ref: '#/components/schemas/InterfaceLang'

    PatchUserRequest:
      type: object
      properties:
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        language:
          $ref: '#/components/schemas/InterfaceLang'

    # ----------------------------------------
    # User Settings Schemas
    # ----------------------------------------
    UserSettings:
      type: object
      required:
        - id
        - user_id
        - skills
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        skills:
          type: array
          items:
            type: string
          example: ["Go", "PostgreSQL", "Docker"]
        grade:
          $ref: '#/components/schemas/Grade'
          nullable: true
        employment_type:
          $ref: '#/components/schemas/EmploymentType'
          nullable: true
        location:
          type: string
          nullable: true
          example: "Moscow, Russia"
        updated_at:
          type: string
          format: date-time

    UpsertUserSettingsRequest:
      type: object
      properties:
        skills:
          type: array
          items:
            type: string
          example: ["Go", "Kubernetes", "PostgreSQL"]
        grade:
          $ref: '#/components/schemas/Grade'
        employment_type:
          $ref: '#/components/schemas/EmploymentType'
        location:
          type: string
          example: "Remote"

    # ----------------------------------------
    # CV Schemas
    # ----------------------------------------
    CV:
      type: object
      required:
        - id
        - user_id
        - cv_file_id
        - cv_path
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        cv_file_id:
          type: string
          example: "AgACAgIAAxkBAAI..."
        cv_path:
          type: string
          example: "/storage/cvs/user_1_resume.pdf"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpsertCVRequest:
      type: object
      required:
        - cv_file_id
        - cv_path
      properties:
        cv_file_id:
          type: string
          example: "BAACAgIAAxkBA..."
        cv_path:
          type: string
          example: "/storage/cvs/user_1_resume.pdf"

    # ----------------------------------------
    # Vacancy Schemas
    # ----------------------------------------
    Vacancy:
      type: object
      required:
        - id
        - external_id
        - source
        - title
        - url
        - created_at
        - parsed_at
      properties:
        id:
          type: integer
          format: int64
          example: 101
        external_id:
          type: string
          example: "12345678"
        source:
          type: string
          example: "HH.ru"
        title:
          type: string
          example: "Junior Golang Developer"
        company:
          type: string
          nullable: true
          example: "Acme Corp"
        salary_text:
          type: string
          nullable: true
          example: "150 000 - 200 000 RUB"
        location:
          type: string
          nullable: true
          example: "Moscow / Remote"
        description:
          type: string
          nullable: true
          example: "Требуется Go разработчик с опытом..."
        url:
          type: string
          example: "https://hh.ru/vacancy/12345678"
        created_at:
          type: string
          format: date-time
        parsed_at:
          type: string
          format: date-time

    CreateVacancyRequest:
      type: object
      required:
        - external_id
        - source
        - title
        - url
      properties:
        external_id:
          type: string
          example: "12345678"
        source:
          type: string
          example: "HH.ru"
        title:
          type: string
          example: "Go Developer"
        company:
          type: string
          example: "Acme Corp"
        salary_text:
          type: string
          example: "до 250 000 руб."
        location:
          type: string
          example: "Remote"
        description:
          type: string
          example: "Описание вакансии..."
        url:
          type: string
          example: "https://hh.ru/vacancy/12345678"

    BatchCreateVacanciesRequest:
      type: object
      required:
        - vacancies
      properties:
        vacancies:
          type: array
          items:
            $ref: '#/components/schemas/CreateVacancyRequest'

    # ----------------------------------------
    # UserVacancy & Recommendation Schemas
    # ----------------------------------------
    UserVacancy:
      type: object
      required:
        - id
        - user_id
        - vacancy_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          example: 1
        vacancy_id:
          type: integer
          format: int64
          example: 101
        match_score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          example: 85
        ai_summary:
          type: string
          nullable: true
          example: "Вакансия отлично подходит по стеку Go и Docker, компания предлагает удаленку."
        cover_letter:
          type: string
          nullable: true
          example: "Здравствуйте! Меня заинтересовала позиция Go разработчика..."
        is_seen:
          type: boolean
          nullable: true
          example: false
        is_favorite:
          type: boolean
          nullable: true
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserVacancyWithDetails:
      allOf:
        - $ref: '#/components/schemas/UserVacancy'
        - type: object
          properties:
            vacancy:
              $ref: '#/components/schemas/Vacancy'

    PatchUserVacancyRequest:
      type: object
      properties:
        is_seen:
          type: boolean
          example: true
        is_favorite:
          type: boolean
          example: true

    GenerateCoverLetterRequest:
      type: object
      properties:
        prompt_override:
          type: string
          description: Optional specific focus for cover letter generation
          example: "Сделай упор на мой опыт работы с PostgreSQL и highload"

    CoverLetterResponse:
      type: object
      required:
        - cover_letter
      properties:
        cover_letter:
          type: string
          example: "Здравствуйте! Увидел вакансию в Acme Corp..."

    # ----------------------------------------
    # AI Worker Task Schemas
    # ----------------------------------------
    MatchingTask:
      type: object
      required:
        - user_id
        - vacancy_id
        - user_settings
        - vacancy
      properties:
        user_id:
          type: integer
          format: int64
        vacancy_id:
          type: integer
          format: int64
        user_settings:
          $ref: '#/components/schemas/UserSettings'
        cv_text:
          type: string
          description: Extracted CV text if available
          nullable: true
        vacancy:
          $ref: '#/components/schemas/Vacancy'

    SaveMatchResultRequest:
      type: object
      required:
        - user_id
        - vacancy_id
        - match_score
      properties:
        user_id:
          type: integer
          format: int64
        vacancy_id:
          type: integer
          format: int64
        match_score:
          type: integer
          minimum: 0
          maximum: 100
          example: 85
        ai_summary:
          type: string
          example: "Отличное совпадение по языку Go и опыту с базами данных."

    BatchSaveMatchResultsRequest:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SaveMatchResultRequest'
